  <script>
    const docs = {"readme": {"category": "Visión General", "title": "📌 Inicio / Visión General", "content": "# Base de Conocimiento: Ecosistema de Sorters y Observabilidad End-to-End\n\nBienvenido a la Base de Conocimiento oficial para la arquitectura, operación y observabilidad del ecosistema de **Sorters (Sistemas de Clasificación Automatizada)** de **Andreani Logística**.\n\nEste repositorio centraliza toda la documentación técnica, diagramas de arquitectura, inventario de componentes y estrategias de monitoreo, con el objetivo de garantizar la trazabilidad integral, disponibilidad operativa y resolución ágil de incidentes.\n\n> 🌐 **Portal Home Page Unificado:** Abre directamente [**`Sorters.html`**](./Sorters.html) en cualquier navegador para recorrer toda la documentación, diagramas vectoriales interactivos y fichas técnicas con identidad corporativa Andreani Cartesian.\n\n---\n\n## 🧭 Mapa de Navegación del Repositorio\n\n### 📚 Documentación Técnica Oficial (`docs/`)\nTodo el trabajo y especificaciones del proyecto se concentran en [**`docs/`**](./docs/README.md):\n\n| Documento / Carpeta | Descripción | Audiencia Principal |\n| :--- | :--- | :--- |\n| 🌐 [**Sorters.html (Home Page)**](./Sorters.html) | Portal web interactivo con menú lateral, buscador, visualizador zoom y modo oscuro/claro. | Toda la Organización |\n| 📘 [**01. Arquitectura General y Ecosistema**](./docs/01-arquitectura-general.md) | Visión macro del negocio logístico, tipología de Sorters (Vertical, TruxSorter, Wayzim, Giops, Regionales) y capas tecnológicas (TMS, SPP, Bases AlwaysOn, Hardware). | Arquitectura, Líderes Técnicos, Operaciones |\n| ⚡ [**02. Flujo End-to-End: Vertical Sorter**](./docs/02-flujo-end-to-end-vertical.md) | Recorrido paso a paso del flujo de datos y paquetería desde la ingesta del cliente hasta la inducción física, clasificación y retroalimentación a dashboards. Incluye resiliencia de Rampa 6. | Desarrolladores, SysAdmins, Observabilidad |\n| 📋 [**03. Catálogo e Inventario de Componentes**](./docs/03-inventario-componentes.md) | Inventario consolidado de más de 50 componentes: APIs, Workers en K8s (CCE/AKS-BR/K3H/K3S), Tópicos de Kafka, Bases de Datos SQL/Redis y listado de PCs industriales. | SRE, DevOps, Monitoreo, Soporte L2/L3 |\n| 🎯 [**04. Estrategia de Observabilidad Integral**](./docs/04-estrategia-observabilidad.md) | Matriz de observabilidad en 4 pilares: Métricas clave (SLIs/SLOs), Logs/APM, Health Checks sintéticos, Matriz de alarmado (P1 a P3) y Runbooks de contingencia. | Equipos de Observabilidad, Centro de Control (NOC), Guardia |\n| 🗺️ [**05. Diagrama E2E y Sensores de Monitoreo**](./docs/05-flujo-observabilidad.md) | Mapa visual que detalla el flujo de datos junto con los 10 sensores de monitoreo recomendados (S1 a S10) y mitigación de SPOFs. | Todos los equipos técnicos |\n| 🎨 [**06. Identidad Visual Corporativa (Cartesian CSS)**](./docs/06-guia-estilos-cartesian.md) | Guía del sistema de diseño de Andreani: tokens nativos de diseño, paleta cromática (Rojo Andreani `#d71920`, Azul `#1f2856`), tipografías Rubik/Roboto y espaciados. | Desarrolladores, Frontend, UX |\n| 🎨 [**docs/diagramas/**](./docs/diagramas/README.md) | Repositorio centralizado con todos los diagramas vectoriales SVG, renders PNG y visor HTML interactivo. | Arquitectura y Observabilidad |\n\n---\n\n### 📁 Relevamiento y Fuentes de Campo (`relevamiento/`)\nEn [**`relevamiento/`**](./relevamiento/README.md) se organizan los materiales de origen agrupados por tipología:\n\n- 🎙️ [**`relevamiento/reuniones/`**](./relevamiento/reuniones/README.md): Minuta técnica (`Observabilidad integral de los Sorters 01.docx`) y grabación en video de la sesión de arquitectura (`.mp4`).\n- 📐 [**`relevamiento/diagramas/`**](./relevamiento/diagramas/README.md): Fuentes preliminares y diagramas editables de trabajo (`mapa de monitoreo sorter.drawio`, `Diagrama01.png`).\n- 📊 [**`relevamiento/planillas/`**](./relevamiento/planillas/README.md): Matriz técnica exhaustiva de relevamiento (`Toma_de_Servicio - Sorters.xlsx`).\n\n---\n\n## 📌 Contexto de Negocio y Rol de los Sorters\n\nEn la cadena logística de Andreani, los **Sorters** son los dispositivos electromecánicos e informáticos de alta velocidad encargados de:\n1. **Identificar** bultos mediante lectores ópticos de código de barras (Datalogic / Honeywell / cámaras de arco).\n2. **Aforar** (pesar y medir dimensiones volumétricas) en movimiento de forma dinámica.\n3. **Clasificar y rutear** automáticamente cada paquete hacia la rampa o boca de salida correspondiente según su destino final, geocerca o tipo de servicio.\n\nEl sistema pivote que articula la lógica de negocio y prepara los datos para las máquinas es el **SPP (Sistema de Paquetería y Procesamiento)**.\n\n---\n\n## 🏗️ Arquitectura en Capas Resumida\n\n![Arquitectura en Capas Resumida](./docs/diagramas/arquitectura-resumida.svg)\n\n---\n\n## 💡 Hito Inicial: Vertical Sorter (CIT 1° Piso)\n\nSiguiendo las definiciones del equipo de Arquitectura y Observabilidad, el primer hito de modelado y monitoreo integral se focaliza en el **Vertical Sorter**. \nEste clasificador reúne todos los desafíos de integración:\n- Microservicios en Kubernetes (`TYD-SPP` y `TYD-SORTERS`)\n- Eventos asíncronos en Apache Kafka (AMQ Streams)\n- Base de datos relacional en alta disponibilidad AlwaysOn (`DBSORTER` e `Integración Vertical`)\n- Almacenamiento de estado y cursor en Redis (`DBSORTERPROD`)\n- Interfaz bidireccional con software de fabricante (Optisoft)\n- Hardware de control industrial (PLC Siemens Simatic S7-400)\n- Circuito de auto-recuperación de excepciones por Rampa 6 (`job-spptovertical`)\n\nUna vez consolidado y monitoreado este circuito, el modelo se replica para los demás tipos de clasificadores de la red (TruxSorter, Wayzim, Giops y Regionales).\n"}, "01-arch": {"category": "Documentación Técnica (docs)", "title": "📘 01. Arquitectura General", "content": "# 01. Arquitectura General y Ecosistema de Sorters\n\n## 1. Introducción y Propósito\nEste documento describe la arquitectura global, los componentes y las interacciones del ecosistema de **Sorters** (clasificadores automáticos de paquetería) en **Andreani Logística**.\n\nEl objetivo central de la automatización mediante Sorters es maximizar la velocidad de procesamiento de paquetes (\"cross-docking\" y ruteo a última milla), reducir errores de despacho manual y capturar datos dimensionales (peso y volumen) en tiempo real para la facturación y la optimización de bodega y transporte.\n\n---\n\n## 2. Tipología de Sorters en Andreani\n\nEn la red logística de Andreani conviven distintas tecnologías y fabricantes de Sorters, adaptados al tipo de bulto y al volumen de la planta:\n\n![Tipología de Sorters](docs/diagramas/tipologia-sorters.svg)\n\n### Detalle de cada tecnología:\n1. **Vertical Sorter (CIT 1° Piso - Central Inteligente de Transferencia)**:\n   - **Uso**: Paquetería estándar y e-commerce de alta velocidad.\n   - **Controlador**: PLC industrial Siemens Simatic S7-400.\n   - **Software de Fabricante**: Optisoft (Optimus) provisto por proveedor brasileño.\n   - **Mecanismo de Integración**: Lectura/escritura asíncrona mediante base de datos relacional intermedia (`Integración Vertical`) con polling por software del proveedor.\n2. **TruxSorter / Vanderlande (CIT Planta Baja)**:\n   - **Uso**: Paquetería de mayor porte o flujo general de transferencias.\n   - **Mecanismo de Integración**: Intercambio por archivos y jobs procesadores (`spp-truxsorter-worker`, `generador-de-archivo-worker`, `archivos-pendientes-job`, `archivos-excepciones-worker`).\n3. **Wayzim Sorters (Plantas Pacheco y Avellaneda)**:\n   - **Uso**: Grandes plantas troncales.\n   - **Mecanismo de Integración**: APIs HTTP locales (`integration-sorters-api` desplegada en clusters locales K3H y K3S, además de AKS-BR en nube).\n4. **Giops (Sorters y Arcos de Aforo In-house)**:\n   - **Uso**: Diseñados y programados por el equipo de ingeniería e innovación de Andreani.\n   - **Mecanismo de Integración**: Consumo directo de eventos de Kafka de SPP (`spp.asignacion-custodia`).\n5. **Sorters Regionales e Irregulares**:\n   - **Uso**: Sucursales cabecera (Bariloche, Chascomús, Córdoba, Mendoza, Salta, Tucumán, Mar del Plata, etc.) y tratamiento de paquetes no estándar (\"irregulares\").\n   - **Mecanismo de Integración**: Microservicios dedicados tipo `sorter-delivery-*` que reciben la orden y orquestan la clasificación local.\n\n---\n\n## 3. Capas Tecnológicas de la Solución\n\nEl ecosistema se organiza en **cinco capas tecnológicas**, garantizando el desacoplamiento entre los sistemas comerciales de venta y las máquinas físicas de planta:\n\n![Capas Tecnológicas](docs/diagramas/capas-tecnologicas.svg)\n\n---\n\n## 4. El Rol Central de SPP (Sistema de Paquetería y Procesamiento)\n\nEl **SPP** es el corazón lógico de la clasificación en Andreani. Funciona como un middleware inteligente cuya misión es:\n\n1. **Abstraer la complejidad de los TMS**: Ya sea que el envío provenga de **Integra** (sistema histórico) o de **DMS** (nueva plataforma de paquetería), SPP unifica los contratos de datos.\n2. **Enriquecimiento Dinámico de Destino**:\n   - Para asignar una rampa física a un paquete no alcanza con el Código Postal (en ciudades de alta densidad como Rosario, Córdoba o Mendoza existen múltiples sucursales que atienden un mismo código postal).\n   - SPP invoca a la **API NDD** para normalizar el domicilio, luego a la **API Geo** para obtener latitud y longitud precisas, y finalmente a la **API de Sucursales / Zonificación** para calcular la **geocerca** exacta de entrega.\n3. **Distribución Multi-Sorter**: Una vez determinado el destino, SPP decide hacia qué sorter debe enviarse la orden mediante eventos especializados (`spp.alta-envio`, `spp.asignacion-custodia`, etc.).\n4. **Alimentación de Monitores Operativos**: Toda la operación de planta sigue el avance de los paquetes en tiempo real consultando la réplica de lectura de `DBSORTER`.\n\n---\n\n## 5. Esquema de Alta Disponibilidad de Bases de Datos (AlwaysOn)\n\nPara aislar el tráfico de alta velocidad que requieren los Sorters de las consultas pesadas de reportería y monitoreo, las bases de datos de Sorters implementan **Microsoft SQL Server AlwaysOn Availability Groups**:\n\n| Instancia de BD | Nodo Primario (Transaccional) | Nodo Secundario (Réplica de Lectura) | Impacto ante Caída del Secundario |\n| :--- | :--- | :--- | :--- |\n| **`DBSORTER`** | Escritura de altas, actualizaciones de estado y trazabilidad en tiempo real. | Consultas de APIs de consulta, reportes (`reportes-api`) y tableros operativos (`spp-dashboard-ui`). | **Crítico para la operación visual**: Si la réplica se cae o se desincroniza, los tableros quedan congelados o en 0, dejando a la planta a ciegas aunque el clasificador físico siga operando. |\n| **`Integración Vertical`** | Lectura/escritura de bultos a clasificar e interconexión con Optisoft. | Réplica de respaldo y auditoría de eventos clasificados. | Pérdida de tolerancia a fallos en la persistencia del clasificador vertical. |\n\n---\n\n## 6. Puntos Clave de Atención para la Operación\n\n1. **Dependencia de APIs Externas**: Si la API de Normalización de Domicilios o la API Geo sufren degradación de latencia, el worker `spp-altas-suscriber` experimenta retrasos en cascada (**Consumer Lag** en Kafka), demorando la llegada del paquete a la base del Sorter antes de que el bulto llegue físicamente a la cinta.\n2. **Caja Negra de Fabricantes**: El software de proveedor (Optisoft/Optimus) opera de forma autónoma en la PC industrial local. La salud de este componente debe inferirse mediante señales indirectas (actividad en tablas de base de datos y procesamiento de eventos por `verticaltoSpp-publisher`).\n3. **Mecanismo de Rampa 6**: La Rampa 6 es el canal de escape físico para paquetes que no poseen orden cargada al pasar por el arco óptico. Una alta tasa de desvío hacia Rampa 6 es el principal indicador de fallas de sincronización previa en el pipeline de software.\n"}, "02-flow": {"category": "Documentación Técnica (docs)", "title": "⚡ 02. Flujo E2E Vertical Sorter", "content": "# 02. Flujo End-to-End: Vertical Sorter (CIT 1° Piso)\n\n## 1. Visión General del Circuito\nEl **Vertical Sorter** ubicado en el primer piso de la Central Inteligente de Transferencia (CIT) es el modelo de referencia para la integración y observabilidad de clasificadores en Andreani. \n\nEste clasificador de bandejas verticales/cross-belt clasifica paquetería estándar y de e-commerce a alta cadencia. El flujo completo abarca desde la solicitud de envío digital por parte de un cliente hasta el momento en que el paquete es expulsado físicamente por una rampa y su estado es consolidado en los tableros operativos de planta.\n\n---\n\n## 2. Diagrama de Secuencia End-to-End\n\n![Diagrama de Secuencia Vertical Sorter](docs/diagramas/flujo-vertical.svg)\n\n---\n\n## 3. Descripción Detallada de las Fases\n\n### Fase 1: Ingesta y Creación de la Orden en TMS\n1. **Cliente / API Unificada**:\n   - Una cuenta comercial, cliente B2C o plataforma de e-commerce genera un requerimiento de transporte.\n   - `API Unificada` recibe la solicitud e interactúa con el broker Kafka publicando el evento `OrdenEnvioSolicitada`.\n2. **Consumo por TMS**:\n   - Los dos sistemas centrales de transporte de Andreani, **DMS** (Delivery Management System) e **Integra** (sistema core), consumen dicho evento.\n   - Al persistir y validar la orden con éxito, emiten el evento `OrdenEnvioCreada`.\n   - *Nota de arquitectura*: DMS e Integra manejan grupos de tópicos independientes. Adicionalmente, ante solicitudes de cambio de entrega por parte del cliente, se emiten eventos de `Cambios Destino` que son sincronizados vía `dotnet-NovedadesALSAtoCasaIntegra`.\n\n---\n\n### Fase 2: Procesamiento en SPP y Enriquecimiento\n1. **Consumo del Alta**:\n   - El worker **`spp-altas-suscriber`** (desplegado en cluster CCE, namespace `TYD-SPP`) escucha el tópico de alta.\n   - Deriva la carga invocando la API REST interna **`spp-altas-api`**.\n2. **Orquestación de Enriquecimiento**:\n   - Para que el clasificador sepa exactamente por qué rampa debe bajar un bulto, no basta con el código postal provisto por el remitente.\n   - `spp-altas-api` realiza llamadas síncronas a tres componentes críticos:\n     - **API Normalización (NDD)**: Normaliza calles, alturas y localidades (`https://ndd-api-aa-domicilios-test.apps.ocptest.andreani.com.ar/normalizar-domicilio`).\n     - **API Geo**: Convierte la dirección normalizada en coordenadas exactas de latitud y longitud.\n     - **API Sucursales / Zonificación**: Calcula la **geocerca** operativa y determina la sucursal de distribución y rampa correspondiente (`apis.andreani.com/v2/sucursales?canal=B2C`).\n3. **Persistencia en Base Central de Sorters**:\n   - `spp-altas-api` inserta el bulto en la base de datos **`DBSORTER`** (nodo primario transaccional).\n\n---\n\n### Fase 3: Despacho de Eventos SPP\n1. **Worker de Despacho**:\n   - El servicio **`publisher-events-spp`** (.NET 6 en cluster CCE) detecta los registros insertados en `DBSORTER`.\n2. **Tópicos Emitidos**:\n   - `spp.alta-envio`: Notifica la disponibilidad de un nuevo bulto listo para clasificación en clasificadores automatizados.\n   - `spp.asignacion-custodia`: Notifica la confirmación de custodia para sorters regionales e in-house (Giops).\n   - `spp.cambio-destino`: Notifica modificaciones dinámicas de rampa o sucursal final.\n   - `spp.geocerca-calculada`: Devuelve la información geocodificada hacia Integra y otros sistemas downstream.\n\n---\n\n### Fase 4: Ingesta en Vertical Sorter\n1. **Consumo hacia Base Intermedia**:\n   - El worker **`spptovertical-suscriber`** consume `spp.alta-envio`.\n   - Inserta la orden en la tabla `tb_evento` de la base de datos **`Integración Vertical`** (SQL Server AlwaysOn).\n   - En este punto finaliza la responsabilidad directa de la plataforma Cloud/K8s de Andreani y comienza la frontera con el software del clasificador.\n\n---\n\n### Fase 4B: Circuito de Resiliencia de Rampa 6 (Excepciones)\n> [!IMPORTANT]\n> **¿Por qué existe el `job-spptovertical` y la Rampa 6?**\n> - La base de datos del Vertical Sorter gestiona una ventana de retención local (históricamente configurada entre 15 y 30 días) para evitar sobrecarga de almacenamiento.\n> - Si un paquete arriba a planta y es colocado en la cinta clasificadora tras más de 30 días de emitida su orden, o si el paquete llegó a la cinta antes de que el mensaje de Kafka terminara de sincronizarse con la base local, el clasificador físico no encuentra el registro en su memoria.\n> - El PLC desvía automáticamente el paquete a la **Rampa 6 (Rampa de Excepciones)**.\n> - El servicio **`job-spptovertical`** corre de forma cíclica (polling), ejecuta una consulta que cruza `bulto`, `paqueteria_envio` y `trazabilidad_registro_sorter` donde `rampa = 6`, recupera los datos desde `DBSORTER` y los **reinyecta masivamente en `Integración Vertical`**.\n> - Cuando el operador recoge el paquete de la rampa 6 y lo vuelve a inducir en la cinta, el Sorter ya cuenta con la información y lo desvía con éxito a su rampa destino final.\n\n---\n\n### Fase 5: Inducción Física y Clasificación en Planta\n1. **Software del Proveedor (Optisoft / Optimus)**:\n   - Reside en la PC industrial asociada al clasificador (`PC100454` - IP `10.20.48.108`).\n   - Realiza polling sobre la tabla `tb_evento` de la base `Integración Vertical`, descarga los envíos pendientes, marca los registros como leídos y los carga en su memoria local.\n2. **Ciclo Electromecánico**:\n   - El operario induce el paquete en el alimentador del Sorter.\n   - Los lectores de código de barras (escáneres cenitales / arcos) leen la etiqueta de Andreani.\n   - Las celdas de carga y barreras infrarrojas efectúan el aforo dinámico (peso en gramos y volumen en cm³).\n   - El PLC **Siemens Simatic S7-400** comanda los desvíos neumáticos/mecánicos depositando el bulto en la rampa asignada.\n   - Optisoft registra el resultado de la clasificación física en la base `Integración Vertical`.\n\n---\n\n### Fase 6: Retorno de Datos, Cierre de Trazabilidad y Dashboards\n1. **Publicador de Retorno (`verticaltoSpp-publisher`)**:\n   - Servicio en segundo plano (.NET 6) desplegado en cluster CCE.\n   - Lee los eventos de clasificación completada desde la base `Integración Vertical`.\n   - Utiliza **Redis (`DBSORTERPROD`)** como caché persistente para almacenar el cursor (offset/timestamp) del último evento procesado, evitando lecturas duplicadas o sobrecarga de consultas SQL.\n   - Publica el evento consolidado en Kafka (ej. `spp.bulto-procesado-vertical-sorter` o `bulto-pesado-y-medido`).\n2. **Actualización de Trazabilidad**:\n   - **`sortervertical-api`** y **`eventosaforo-api`** consumen el evento, registran el aforo oficial y actualizan el estado final en `DBSORTER`.\n   - Los datos se replican en tiempo real al nodo secundario AlwaysOn de `DBSORTER`.\n3. **Monitoreo en Planta**:\n   - Los supervisores de planta visualizan el rendimiento en **`spp-dashboard-ui`**, que consulta exclusivamente la **réplica de lectura de `DBSORTER`**.\n\n> [!CAUTION]\n> **El síntoma del \"Tablero en Cero\":**  \n> Si el servicio `verticaltoSpp-publisher` se detiene o pierde conexión con Redis/SQL, el Vertical Sorter físico seguirá operando y clasificando bultos con normalidad, pero ningún dato regresará a `DBSORTER`. En consecuencia:\n> - Los tableros de control mostrarán **0 bultos clasificados por hora**.\n> - Se perderá la trazabilidad en vivo de los paquetes.\n> - Este desacoplamiento hace mandatorio el monitoreo activo de `verticaltoSpp-publisher` como servicio crítico P1.\n"}, "03-inv": {"category": "Documentación Técnica (docs)", "title": "📋 03. Catálogo de Componentes", "content": "# 03. Catálogo e Inventario de Componentes\n\nEste inventario consolida todos los componentes de software, mensajería, bases de datos y hardware relevados a partir de la toma de servicio de Sorters, la sesión de arquitectura técnica y los registros de infraestructura.\n\n> 📁 **Documentos fuente de relevamiento:** El detalle original de componentes, repositorios, accesos y minutas de reuniones se encuentra resguardado en la carpeta [**`relevamiento/`**](../relevamiento/README.md) (especialmente en [**`relevamiento/planillas/Toma_de_Servicio - Sorters.xlsx`**](../relevamiento/planillas/Toma_de_Servicio%20-%20Sorters.xlsx) y [**`relevamiento/reuniones/`**](../relevamiento/reuniones/README.md)).\n\n---\n\n## 1. Microservicios, APIs y Workers\n\n### 1.1. Core SPP y Clasificación General\n\n| Componente | Tipo | Namespace | Ambiente / Cluster | Tecnología | Descripción y Rol Operativo |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| **`altas-suscriber`** (`spp-altas-suscriber`) | WORKER | `TYD-SPP` | CCE | .NET 6.0 | Consume eventos de alta (`OrdenEnvioCreada`) desde Kafka y dispara la creación en SPP invocando a `altas-api`. |\n| **`altas-api`** (`spp-altas-api`) | API | `TYD-SPP` | CCE | .NET 6.0 | Orquesta el enriquecimiento de domicilio, geolocalización y zonificación, e inserta el paquete en `DBSORTER`. |\n| **`publisher-event-spp`** | WORKER | `TYD-SPP` | CCE | .NET 6.0 | Lee nuevos envíos desde `DBSORTER` y los publica a los tópicos Kafka downstream (`spp.alta-envio`, `spp.asignacion-custodia`, etc.). |\n| **`acciones-suscriber`** | WORKER | `TYD-SPP` | AKS-BR | .NET | Escucha eventos de acciones y modificaciones operativas originadas en DMS. |\n| **`acciones-api`** | API | `TYD-SPP` | AKS-BR | .NET | Endpoint de actualización de acciones sobre bultos. |\n| **`geocerca-consumer`** | WORKER | `TYD-SPP` | CCE | .NET | Escucha `geocerca-calculada` y `envios-traza-fin-de-custodia` e invoca a la API de normalización. |\n| **`eventosaforo-api`** | WORKER | `TYD-SPP` | CCE | .NET | Suscriptor de `bulto-informado`, procesa métricas de balanza y publica `bulto-pesado-y-medido`. |\n| **`dotnet-consolidacion-spp-api`** | WORKER | `TYD-SPP` | CCE | .NET | Suscriptor de `apto-para-consolidar` y publica `bulto-pesado-y-medido`. |\n| **`dotnet-stream-EnvioAptoParaConsolidar-publisher`** | WORKER | `TYD-SORTERS` | CCE | .NET | Lee de la tabla `EventosParaPublicar` de Integra y publica eventos `apto-para-consolidar`. |\n| **`mq-bridge`** | API | `TYD-SPP` | CCE | .NET | Puente de mensajería para compatibilidad con sistemas MQ legados. |\n| **`administracion-api`** | API | `TYD-SPP` | AKS-BR (Migrar a CCE) | .NET | API de backend para gestión y configuración de parámetros de clasificación. |\n| **`procesamiento-api`** | API / PUB | `TYD-SPP` | CCE | .NET | Publicador y procesador de eventos de bultos para paquetería. |\n| **`consolidacion-automatica-api`** | API | `TYD-SPP` | CCE | .NET | Servicio de consolidación de bultos en contenedores/jaulas. |\n| **`oneclick`** | API / PUB | `TYD-SPP` | CCE | .NET | Orquestador de operaciones express de despacho y sincronización. |\n| **`tracking-api`** | API | `TYD-SPP` | AKS-BR (Migrar a CCE) | .NET | Consulta de estado de trazabilidad interna de envíos en planta. |\n| **`MobileTrackingInternoAPP`** | WEB / APP | `TYD-SPP` | CCE | React / Web | Aplicación web para seguimiento y escaneo manual en planta. |\n\n---\n\n### 1.2. Componentes Específicos del Vertical Sorter\n\n| Componente | Tipo | Namespace | Ambiente / Cluster | Tecnología | Descripción y Rol Operativo |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| **`spptovertical-suscriber`** | WORKER | `TYD-SPP` | CCE | .NET 6.0 | Suscriptor del tópico `spp.alta-envio`. Inserta el registro en la tabla `tb_evento` de la base `Integración Vertical`. |\n| **`job-spptovertical`** (Job Rampa 6) | WORKER | `TYD-SPP` | CCE | .NET / Batch | Job de resiliencia. Pollea `DBSORTER` buscando bultos expulsados por Rampa 6 y los reinyecta en `Integración Vertical`. |\n| **`verticaltoSpp-publisher`** | WORKER | `TYD-SPP` | CCE | .NET 6.0 | Background service que lee bultos clasificados de `Integración Vertical`, usa Redis para el cursor y publica eventos a Kafka. |\n| **`sortervertical-api`** | WORKER / API | `TYD-SPP` | CCE | .NET 6.0 | Consume eventos de clasificación del Vertical Sorter, procesa aforo (peso/medidas) y actualiza `DBSORTER`. |\n\n---\n\n### 1.3. Componentes TruxSorter (Vanderlande) y Wayzim\n\n| Componente | Tipo | Namespace | Ambiente / Cluster | Tecnología | Descripción y Rol Operativo |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| **`spp-truxsorter-worker`** | WORKER | `TYD-SORTERS` | AKS-BR | .NET | Worker de integración para el TruxSorter de planta baja CIT (Vanderlande). |\n| **`generador-de-archivo-worker`** | WORKER | `TYD-SPP` | AKS-BR | .NET | Genera los archivos batch para alimentación de clasificadores por lotes. |\n| **`archivos-pendientes-job`** | WORKER | `TYD-SPP` | AKS-BR | .NET | Job de control y reintento de archivos batch pendientes de procesamiento. |\n| **`archivos-excepciones-worker`** | WORKER | `TYD-SPP` | AKS-BR | .NET | Gestión de archivos rechazados o con inconsistencias de formato. |\n| **`integration-sorters-api` (Nube)** | API | `TYD-SPP` | AKS-BR | .NET | API central de integración para clasificadores Wayzim. |\n| **`integration-sorters-api` (Pacheco)** | API | `TYD-SPP` | K3H (Pacheco) | .NET | Instancia local de baja latencia para el clasificador Wayzim en Pacheco. |\n| **`integration-sorters-api` (Avellaneda)** | API | `TYD-SPP` | K3S (Avellaneda) | .NET | Instancia local de baja latencia para el clasificador Wayzim en Avellaneda. |\n\n---\n\n### 1.4. Microservicios de Sorters Regionales e Irregulares (`sorter-delivery-*`)\n\nTodos estos microservicios operan en el namespace **`TYD-SORTERS`** en ambiente **CCE**:\n\n| Servicio | Ubicación / Destino | Finalidad |\n| :--- | :--- | :--- |\n| `sorter-delivery-bariloche` | Bariloche | Clasificación y derivación local |\n| `sorter-delivery-cas` | Casa Central / CAS | Ruteo interno de transferencias |\n| `sorter-delivery-chascomus` | Chascomús | Clasificación local |\n| `sorter-delivery-cordoba` | Córdoba Planta 1 | Clasificación troncal |\n| `sorter-delivery-cordoba-2` | Córdoba Planta 2 | Clasificación distribución |\n| `sorter-delivery-ctc` | CTC Roca (CABA) | Clasificación de paquetería urbana |\n| `sorter-delivery-ctc2` | CTC 2 | Segundo anillo de clasificación |\n| `sorter-delivery-irregulares` | CIT Irregulares | Paquetes de gran porte o formas no estándar |\n| `sorter-delivery-irregulares-ctc` | CTC Irregulares | Paquetes irregulares en CTC |\n| `sorter-delivery-irregulares-mbp` | MBP Irregulares | Paquetes irregulares en MBP |\n| `sorter-delivery-irregulares-tucuman`| Tucumán Irregulares | Clasificación de bultos fuera de norma |\n| `sorter-delivery-mardelplata` | Mar del Plata 1 | Clasificación costa atlántica |\n| `sorter-delivery-mardelplata-2` | Mar del Plata 2 | Distribución local |\n| `sorter-delivery-mendoza` | Mendoza | Clasificación Cuyo |\n| `sorter-delivery-salta` | Salta | Clasificación NOA |\n| `sorter-delivery-tortugitas` | Tortuguitas | Clasificación Norte GBA |\n| `sorter-delivery-tucuman` | Tucumán | Clasificación NOA Troncal |\n| `sorter-delivery-villasoldati` | Villa Soldati | Clasificación Sur CABA |\n| `sorter-delivery-barracas` | Barracas | Hub logístico de distribución |\n\n---\n\n### 1.5. Capa de Monitoreo Operativo y UI\n\n| Componente | Tipo | Namespace | Ambiente | Descripción |\n| :--- | :--- | :--- | :--- | :--- |\n| **`spp-dashboard-ui`** | WEB | `TYD-SPP` | AKS-BR (Pasar a CCE) | Frontend de monitoreo en tiempo real de paquetería clasificada (alimentado por réplica de `DBSORTER`). |\n| **`reportes-api`** | API | `TYD-SPP` | CCE | Backend de consultas analíticas y rendimiento histórico. |\n| **`abm-ui`** | WEB | `TYD-SPP` | CCE | Frontend de configuración de reglas de negocio, rampas y usuarios. |\n| **`react-native-spp-app`** | APP | - | Intune | Aplicación móvil para operarios de piso. |\n\n---\n\n## 2. Inventario de Tópicos de Apache Kafka\n\n| Nombre del Tópico | Productores Principales | Consumidores Principales | Finalidad Operativa |\n| :--- | :--- | :--- | :--- |\n| `orden-envio-solicitada` | API Unificada | DMS, Integra | Inicia el pedido de creación de envío en los TMS. |\n| `orden-envio-creada` | DMS, Integra | `spp-altas-suscriber` | Notifica que la orden fue persistida y está lista para ingresar a SPP. |\n| `spp.alta-envio` | `publisher-events-spp` | `spptovertical-suscriber` | Notifica un nuevo paquete listo para clasificar en Vertical Sorter. |\n| `spp.asignacion-custodia` | `publisher-events-spp` | Sorters Regionales, Giops | Notifica asignación y toma de custodia por un clasificador. |\n| `spp.cambio-destino` | `publisher-events-spp` / TMS | SPP, Sorters | Propaga cambios de sucursal o rampa solicitados dinámicamente. |\n| `spp.geocerca-calculada` | `publisher-events-spp` | Integra, `geocerca-consumer` | Difunde las coordenadas y zona calculada para sincronización de sistemas. |\n| `bulto-informado` | Sorters, Balanzas | `eventosaforo-api` | Emite la lectura cruda de escaneo y peso detectado. |\n| `bulto-pesado-y-medido` | `eventosaforo-api` | SPP, Facturación, Trazabilidad | Evento oficial con peso dimensional y métrico consolidado. |\n| `apto-para-consolidar` | `dotnet-stream-publisher` | `dotnet-consolidacion-spp-api`| Habilita el bulto para ser consolidado en contenedor final. |\n| `spp.bulto-procesado-vertical`| `verticaltoSpp-publisher` | `sortervertical-api` | Reporta el bulto físicamente clasificado en rampa por el Vertical Sorter. |\n\n---\n\n## 3. Bases de Datos y Caches\n\n| Instancia / Identificador | Motor | Topología / Alta Disponibilidad | Uso Principal |\n| :--- | :--- | :--- | :--- |\n| **`DBSORTER`** (Primario) | Microsoft SQL Server | AlwaysOn Availability Group | Transaccional primario: altas, ruteo, estados y trazabilidad central de bultos. |\n| **`DBSORTER`** (Réplica Nodo 2) | Microsoft SQL Server | AlwaysOn Secondary (Read-Only) | Consultas analíticas, reportes y dashboards en vivo (`spp-dashboard-ui`). No debe caerse. |\n| **`Integración Vertical`** (Primario) | Microsoft SQL Server | AlwaysOn Availability Group | Tabla intermedia `tb_evento` donde escribe SPP y de donde lee/escribe Optisoft. |\n| **`Integración Vertical`** (Nodo 2) | Microsoft SQL Server | AlwaysOn Secondary (Read-Only) | Respaldo y auditoría del circuito vertical. |\n| **`DBSORTERPROD`** (Redis) | Redis Cache | Standalone / Sentinel | Almacena el cursor (offset/timestamp) de `verticaltoSpp-publisher` para control de lectura. |\n| **`INTEGRA`** | SQL Server / Oracle | Cluster Corporativo | Base de datos maestra de clientes, contratos y logística histórica. |\n\n---\n\n## 4. Inventario de PCs Industriales y Sorters Físicos\n\n| Nombre de PC | Nombre Visible / Ubicación | Dirección IP | En Dominio | Observaciones |\n| :--- | :--- | :--- | :--- | :--- |\n| `PC100454` | **PC_SORTER_Vertical** (CIT 1° Piso) | `10.20.48.108` | Relevado | PC industrial que corre Optisoft para el clasificador vertical. |\n| `PC044588` | **PC_SORTER_Vanderlande** (CIT PB) | `10.20.52.140` | Relevado | Control y procesamiento batch del TruxSorter Vanderlande. |\n| `PC029006` | **PC_SORTER_Cordoba 2** | `10.20.177.10` | Relevado | Clasificador troncal Córdoba. |\n| `PC040350` | **PC_SORTER_Bariloche** | `10.20.142.101` | Relevado | Clasificador estándar Bariloche. |\n| `PC101006` | **PC_SORTER_Bariloche (Irregulares)**| `10.200.86.102` | Relevado | Clasificador de irregulares Bariloche. |\n| `PC100062` | **PC_SORTER_Gualeguaychu** | `10.20.145.67` | Relevado | Clasificador Gualeguaychú. |\n| `PC043836` | **PC_SORTER_Tucuman** | `10.20.137.49` | Relevado | Clasificador troncal Tucumán. |\n| `PC042990` | **PC_SORTER_Tow Line 2** | *A relevar* | Pendiente | Tow Line CIT. |\n| `PC035497` | **PC_SORTER_CIT (Irregulares)** | *A relevar* | Pendiente | Clasificador de irregulares CIT. |\n| `PC047083` | **PC_SORTER_Tucuman (Irregulares)** | *A relevar* | Pendiente | Clasificador de irregulares Tucumán. |\n| `PC100038` | **PC_SORTER_Salta** | *A relevar* | Pendiente | Clasificador Salta. |\n| `PC038915` | **PC_SORTER_Bahia (Irregulares)** | *A relevar* | Pendiente | Clasificador Bahía Blanca. |\n| `PC044150` | **PC_SORTER_Chascomus** | *A relevar* | Pendiente | Clasificador Chascomús. |\n| `PC044652` | **PC_SORTER_Avellaneda** | *A relevar* | Pendiente | Clasificador Avellaneda. |\n| `PC047076` | **PC_SORTER_Avellaneda 2** | *A relevar* | Pendiente | Segundo clasificador Avellaneda. |\n| `PC046981` | **PC_SORTER_CTC 2** | *A relevar* | Pendiente | Clasificador CTC Roca. |\n| `PC047072` | **PC_SORTER_Cordoba AU9** | *A relevar* | Pendiente | Clasificador Córdoba AU9. |\n| `PC100036` | **PC_SORTER_Cordoba** | *A relevar* | Pendiente | Clasificador Córdoba Planta Central. |\n| `PC100112` | **PC_SORTER_Mendoza** | *A relevar* | Pendiente | Clasificador Mendoza. |\n| `PC101044` | **PC_SORTER_Mar del Plata 2** | *A relevar* | Pendiente | Clasificador Mar del Plata. |\n\n---\n\n## 5. Controladores Industriales (PLCs)\n\n- **Marca / Modelo**: **Siemens Simatic S7-400**\n- **Protocolo de Diagnóstico de Red**: SNMP v2c / v3 (MIB estándar de automatización industrial y módulos de comunicación Ethernet CP 443-1).\n- **Rol en Planta**: Control en tiempo real de fotocélulas, velocidad de cinta, encoders de posición y activación de zapatas o brazos desviadores hacia las rampas de salida.\n"}, "04-obs": {"category": "Documentación Técnica (docs)", "title": "🎯 04. Estrategia de Observabilidad", "content": "# 04. Estrategia de Observabilidad Integral para Sorters\n\n## 1. Objetivos y Alcance\nLa observabilidad del ecosistema de Sorters tiene como meta garantizar:\n1. **Continuidad Operativa**: Asegurar que los paquetes fluyan sin cuellos de botella desde su ingesta digital hasta su clasificación física.\n2. **Detección Temprana de Fallas Silenciosas**: Identificar anomalías donde el hardware sigue funcionando pero el software perdió sincronización (ej. \"Tablero en Cero\"), o donde las dependencias externas degradan el ruteo.\n3. **Reducción del MTTR (Mean Time to Resolution)**: Brindar a los equipos de soporte y guardia alertas claras con contexto y runbooks precisos de resolución.\n\n---\n\n## 2. Los Cuatro Pilares de Observabilidad\n\n![Cuatro Pilares de Observabilidad](docs/diagramas/pilares-observabilidad.svg)\n\n---\n\n## 3. Indicadores Clave de Servicio (SLIs / SLOs)\n\n| Indicador (SLI) | Componente Objetivo | Umbral Normal | Umbral Advertencia (Warning) | Umbral Crítico (Critical) |\n| :--- | :--- | :--- | :--- | :--- |\n| **Consumer Lag (Kafka)** | `spp-altas-suscriber` | < 100 mensajes | 100 - 1.000 mensajes | > 1.000 mensajes durante > 5 min |\n| **Consumer Lag (Kafka)** | `spptovertical-suscriber` | < 50 mensajes | 50 - 300 mensajes | > 300 mensajes durante > 3 min |\n| **Latencia P95 de Enriquecimiento** | `spp-altas-api` -> NDD / Geo | < 250 ms | 250 ms - 800 ms | > 1.200 ms durante > 3 min |\n| **Throughput de Retorno** | `verticaltoSpp-publisher` | > 0 bultos/min (en horario operativo) | 0 bultos/min durante 5 min con cinta activa | 0 bultos/min durante > 10 min |\n| **Tasa de Desvío a Rampa 6** | `tb_evento` (Integración Vertical) | < 1.5% del total de bultos | 1.5% - 5% | > 5% del volumen en 1 hora |\n| **Latencia de Replicación AlwaysOn**| `DBSORTER` (Nodo 2) | < 2 segundos | 2s - 15s | > 30s o estado `DISCONNECTED` |\n| **Conectividad a Redis Cursor** | `verticaltoSpp-publisher` | Conectado / PING PONG | Latencia Redis > 20ms | Desconexión / Error de autenticación |\n| **Disponibilidad de PC Sorter** | `PC100454` (`10.20.48.108`) | ICMP Ping < 10ms | Ping 10 - 50ms | Pérdida de paquetes > 20% o No Host |\n\n---\n\n## 4. Matriz de Alarmado y Severidad\n\n### 🔴 P1 - Crítica (Impacto Operativo Inmediato / Planta Ciegas o Parada)\n- **Tiempo de Respuesta (SLA)**: < 15 minutos.\n- **Ruta de Escalamiento**: NOC -> Guardia Observabilidad -> Guardia Desarrollo SPP / Infraestructura.\n\n| Condición Monitoreada | Señal de Detección | Impacto en Negocio | Acción Inmediata (Runbook) |\n| :--- | :--- | :--- | :--- |\n| **Caída de Réplica de `DBSORTER`** | Estado de sincronización AlwaysOn `NOT SYNCHRONIZING` o probe de conexión fallido. | Los tableros `spp-dashboard-ui` fallan o se congelan. La supervisión de planta queda a ciegas. | Verificar salud del nodo secundario SQL Server. Si no recupera, conmutar temporalmente la cadena de conexión de `reportes-api` al nodo primario con autorización de DBA. |\n| **\"Tablero en Cero\" (`verticaltoSpp-publisher` inactivo)** | Pod en `CrashLoopBackOff`, error de conexión a SQL/Redis o métrica de publicación = 0 durante 10 min. | La máquina clasifica pero no se actualiza la trazabilidad. Se pierde el control de bultos clasificados y reportes de producción. | 1. Revisar logs del pod `verticaltoSpp-publisher`.<br/>2. Comprobar disponibilidad de Redis `DBSORTERPROD`.<br/>3. Reiniciar el deployment en K8s (`kubectl rollout restart deployment verticaltoSpp-publisher -n tyd-spp`). |\n| **Acumulación Extrema de Lag en `spp-altas-suscriber`** | Lag en tópico Kafka > 5.000 mensajes creciendo sostenidamente. | Los envíos no llegan a `DBSORTER`. Cuando el bulto llega físicamente al arco de lectura, no existe orden y se expulsa masivamente a Rampa 6. | 1. Verificar latencia de `API Normalización (NDD)` y `API Geo`.<br/>2. Si las APIs externas están caídas o lentas, alertar al equipo de Domicilios/Geo.<br/>3. Escalar réplicas del worker si el consumo es CPU-bound. |\n| **Pérdida de Conectividad con la PC Industrial / PLC** | Host `10.20.48.108` inalcanzable por ICMP / SNMP durante > 3 min. | Caída del clasificador físico o corte de red en planta CIT. | Contactar de inmediato a Mantenimiento Electromecánico y Soporte de Infraestructura en Planta CIT. |\n\n---\n\n### 🟡 P2 - Alta (Degradación de Servicio / Riesgo de Saturación)\n- **Tiempo de Respuesta (SLA)**: < 1 hora.\n\n| Condición Monitoreada | Señal de Detección | Impacto en Negocio | Acción Inmediata (Runbook) |\n| :--- | :--- | :--- | :--- |\n| **Incremento Anormal en Rampa 6** | Ratio de bultos a Rampa 6 > 5% en la última hora. | Sobrecarga de operarios recogiendo paquetes rechazados. Posible falla de sincronización de `spptovertical-suscriber` o demoras en TMS. | 1. Verificar estado de ejecución de `job-spptovertical`.<br/>2. Validar que no haya desfasajes de fecha/hora entre la base y el clasificador.<br/>3. Revisar logs de escáner en búsqueda de etiquetas ilegibles. |\n| **Degradación de APIs de Enriquecimiento** | HTTP 5xx o timeout > 2s en API NDD o API Sucursales. | Retardo en la ingesta y clasificación automática. | Alertar al equipo de Canales / APIs Core y activar circuit breaker o modo de degradación controlada si está disponible. |\n| **Almacenamiento en Bases de Datos > 85%** | Espacio en disco de `DBSORTER` o `Integración Vertical` próximo a saturación. | Riesgo de suspensión de escrituras SQL y parada completa de operaciones. | Ejecutar rutinas de purga/historificación de bultos mayores a 30 días con el equipo DBA. |\n\n---\n\n### 🟢 P3 - Media / Informativa (Advertencias y Mantenimiento)\n- **Tiempo de Respuesta (SLA)**: Horario hábil / siguiente ciclo.\n\n| Condición Monitoreada | Señal de Detección | Impacto en Negocio | Acción Inmediata |\n| :--- | :--- | :--- | :--- |\n| **Reinicios aislados de Pods** | Eventos `OOMKilled` o reinicios esporádicos en workers secundarios. | Ninguno visible si la réplica absorbe el tráfico. | Ajustar memory/CPU limits en los manifiestos de Kubernetes. |\n| **Desvío de Tópicos Secundarios** | Lag moderado en `spp.cambio-destino` o `geocerca-consumer`. | Demoras menores en recanalizaciones. | Monitorear evolución y rebalanceo de particiones Kafka. |\n\n---\n\n## 5. Puntos de Control y Trazabilidad Distribuida\n\nPara seguir el ciclo de vida de un paquete de punta a punta, se establece el estándar de instrumentación mediante **Elastic APM** y **OpenTelemetry** propagando los siguientes identificadores en todos los headers HTTP y metadata de Kafka:\n\n```text\n[Header HTTP / Kafka Metadata]\nX-Trace-Id:       GUID de trazabilidad distribuida\nX-Andreani-Envio: Número de Envío único (ej. 000001234567)\nX-Andreani-Bulto: Número de Bulto físico (ej. 000001234567-01)\n```\n\n### Consultas Rápidas para Diagnóstico en Kibana / Elastic APM:\n- **Trazar un bulto específico en todos los servicios:**\n  ```kql\n  labels.bulto: \"000001234567-01\" or message: \"*000001234567-01*\"\n  ```\n- **Identificar cuellos de botella en la ingesta del Vertical Sorter:**\n  ```kql\n  service.name: \"verticaltoSpp-publisher\" and log.level: \"error\"\n  ```\n- **Analizar rechazos hacia Rampa 6:**\n  ```kql\n  service.name: \"job-spptovertical\" and message: \"*rampa 6*\"\n  ```\n\n---\n\n## 6. Monitoreo del Software del Proveedor (Optisoft / Optimus)\n\nDado que Optisoft es un componente propietario provisto por un tercero brasileño sin instrumentación APM nativa:\n\n1. **Heartbeat Sintético por Base de Datos**:\n   - Monitorear periódicamente la columna `FechaModificacion` o estado de lectura en la tabla `tb_evento`.\n   - Si existen bultos pendientes de clasificación y la fecha del último registro modificado por Optisoft supera los **5 minutos**, disparar alarma de **\"Optisoft Inactivo / No Consume\"**.\n2. **Supervisión de Host**:\n   - Monitoreo mediante Zabbix / Telegraf en la PC `PC100454`:\n     - Estado del proceso del ejecutable de Optisoft.\n     - Uso de CPU y memoria RAM.\n     - Conectividad TCP al puerto de base de datos SQL Server y al puerto Ethernet del PLC Siemens S7-400.\n3. **Canal de Escalamiento con Proveedor**:\n   - Contacto técnico directo (Celso / equipo de soporte del fabricante) según lo definido en los acuerdos de servicio para soporte de nivel 3.\n"}, "05-flujo": {"category": "Documentación Técnica (docs)", "title": "🗺️ 05. Diagrama E2E y Sensores", "content": "# 05. Diagrama End-to-End de Observabilidad: Ecosistema Sorters\n\nEste documento contiene el **mapa integral de observabilidad** del circuito de Sorters, con foco en el **Vertical Sorter (CIT 1° Piso)**. Representa el flujo de información y paquetería de punta a punta, señalizando los **puntos de control y sensores de monitoreo (S1 a S10)** recomendados para la instrumentación.\n\n---\n\n## 🗺️ Diagrama de Arquitectura y Puntos de Control\n\n> 💡 **Formatos disponibles para ver el diagrama con flechas y colores:**\n> - 🌐 **Visor Interactivo:** Abrir [`diagramas/diagrama-flujo-observabilidad.html`](./diagramas/diagrama-flujo-observabilidad.html) en tu navegador con zoom y navegación.\n> - 🖼️ **Imagen Vectorial:** Abrir [`diagramas/diagrama-flujo-observabilidad.svg`](./diagramas/diagrama-flujo-observabilidad.svg) o [`diagramas/diagrama-flujo-observabilidad.png`](./diagramas/diagrama-flujo-observabilidad.png).\n> - 📁 **Catálogo Completo:** Ver todos los diagramas en [**`docs/diagramas/`**](./diagramas/README.md).\n\n![Diagrama End-to-End de Observabilidad Sorters](docs/diagramas/diagrama-flujo-observabilidad.svg)\n\n---\n\n## 🎯 Catálogo de Sensores y Puntos de Control\n\n| Sensor | Punto del Flujo | Métrica / Señal Monitoreada | Severidad y Criterio de Alarma |\n| :--- | :--- | :--- | :--- |\n| **[S1]** | Ingesta Kafka (`orden-envio-creada`) | Consumer Lag de `spp-altas-suscriber`. | **P1**: Lag > 1.000 mensajes sostenido por más de 5 minutos. |\n| **[S2]** | APIs de Enriquecimiento (NDD / Geo / Sucursales) | Latencia HTTP P95 y tasa de error HTTP 5xx. | **P2**: Latencia > 800 ms o tasa de error > 2% durante 3 minutos. |\n| **[S3]** | Clúster `DBSORTER` (AlwaysOn) | Estado de replicación del nodo secundario (Réplica de lectura). | **P1**: Estado `NOT SYNCHRONIZING` o réplica inalcanzable (afecta tableros). |\n| **[S4]** | Tópico Kafka `spp.alta-envio` | Consumer Lag de `spptovertical-suscriber`. | **P2**: Lag > 300 mensajes. Retraso en la preparación de bultos en Vertical. |\n| **[S5]** | Resiliencia Rampa 6 (`job-spptovertical`) | Porcentaje de paquetes desviados a Rampa 6 respecto al total clasificado. | **P2**: Tasa de Rampa 6 > 5% en la última hora (indica fallas de pre-sincronización o etiquetas rotas). |\n| **[S6]** | Software Proveedor y Hardware (Optisoft + Siemens S7-400) | Actividad de polling en `tb_evento`, ICMP Ping a `10.20.48.108` y SNMP a PLC. | **P1**: Sin actualización en `tb_evento` con bultos en cola > 5 min, o Host inalcanzable. |\n| **[S7]** | Publicador de Retorno (`verticaltoSpp-publisher`) | Estado del Pod en K8s, conectividad a Redis (`DBSORTERPROD`) y tasa de eventos emitidos. | **P1**: Pod caído o 0 bultos emitidos durante 10 min en franja operativa (\"Tablero en Cero\"). |\n| **[S8]** | Tableros Operativos (`spp-dashboard-ui`) | Disponibilidad HTTP 200 y tiempo de carga de vistas de supervisor. | **P2**: UI no accesible o `reportes-api` devolviendo errores de timeout. |\n| **[S9]** | Tópico de Custodia (`spp.asignacion-custodia`) | Lag de consumo de sorters regionales e in-house (Giops). | **P3**: Lag elevado en sucursales particulares (aislamiento de red en planta remota). |\n| **[S10]** | Sincronización de Modificaciones (`spp.cambio-destino`) | Latencia de impacto de redirecciones solicitadas por clientes. | **P3**: Demora en la actualización de paquetes que cambiaron de sucursal. |\n\n---\n\n## 🛡️ Matriz de Mitigación de Puntos Únicos de Falla (SPOF)\n\n```text\n+------------------------------------+-------------------------------------------+----------------------------------------------+\n| Componente Crítico                 | Modo de Falla                             | Mecanismo de Resiliencia Implementado        |\n+------------------------------------+-------------------------------------------+----------------------------------------------+\n| spp-altas-api                      | Caída de API NDD / Geo                    | Encolamiento en Kafka + Reintentos con Backoff|\n| Integración Vertical               | Bulto antiguo depurado (> 15/30 días)     | Rampa 6 física + job-spptovertical (polling) |\n| verticaltoSpp-publisher            | Caída de conexión a Redis Cursor          | Resguardo de offset en memoria + reconexión  |\n| DBSORTER (Primario)                | Falla de hardware en servidor SQL         | Conmutación por error automática (AlwaysOn)  |\n| DBSORTER (Réplica de Lectura)      | Desincronización o reinicio de réplica    | Fallback controlado hacia nodo primario      |\n+------------------------------------+-------------------------------------------+----------------------------------------------+\n```\n"}, "06-cartesian": {"category": "Documentación Técnica (docs)", "title": "🎨 06. Guía Estilos Cartesian", "content": "# 06. Guía de Identidad Visual Corporativa (Cartesian CSS)\n\nEsta guía documenta la integración del **Sistema de Diseño Cartesian de Andreani** implementado a nivel de **estilos CSS nativos** en este repositorio y en el portal de observabilidad.\n\n---\n\n## 1. Fundamentos del Sistema\n\nEl sistema **Cartesian** estandariza tokens de diseño organizados jerárquicamente para garantizar una experiencia visual coherente, accesible y alineada a la marca Andreani:\n\n1. **Tokens Primitivos**: Valores base puros (escalas cromáticas 50 a 900, fuentes, espaciados en px).\n2. **Tokens Semánticos**: Asignación de intención funcional (superficie, fondo, texto, bordes, estados de interacción como hover, pressed o disabled).\n3. **Soporte Bimodal**: Variables adaptativas automáticas para **Light Mode** y **Dark Mode**.\n\nEl archivo canonical de este repositorio es [`docs/assets/cartesian.css`](./assets/cartesian.css), utilizable directamente en cualquier página HTML sin necesidad de empaquetadores ni dependencias externas.\n\n---\n\n## 2. Paleta Cromática Oficial\n\n### Rojo Andreani (Primario Institucional)\n\nColor emblema de la compañía. Se utiliza en barras de navegación, botones primarios, estados activos e indicadores críticos.\n\n| Token | Valor Hex | Uso Principal |\n| :--- | :---: | :--- |\n| `--c-red-50` | `#fbe8e9` | Fondo sutil de selección / badges |\n| `--c-red-500` | `#df474d` | Alertas / acentos secundarios |\n| `--c-red-600` | `#d71920` | **Rojo oficial Andreani** |\n| `--c-red-700` | `#b6040b` | Hover y estados de presión |\n| `--c-red-900` | `#560a0d` | Tonos oscuros de contraste |\n\n### Azul Institucional Andreani\n\nAporta sobriedad, alta legibilidad y jerarquía a títulos y estructura.\n\n| Token | Valor Hex | Uso Principal |\n| :--- | :---: | :--- |\n| `--c-blue-50` | `#edeffb` | Fondos de información técnica y tags |\n| `--c-blue-600` | `#4e63d7` | Hipervínculos e indicadores informativos |\n| `--c-blue-900` | `#1f2856` | **Azul noche corporativo** para tipografía y topbars |\n\n### Escalas de Soporte Operativo\n\n- **Verde Éxito / Operación Normal**: `--c-green-600` (`#1f7e5a`), `--c-green-50` (`#ddf3ea`).\n- **Amarillo / Ámbar Precaución / Señalética**: `--c-yellow-700` (`#d4a140`), `--c-yellow-50` (`#fff9ed`).\n- **Naranja Advertencia / Rampa de Excepción**: `--c-orange-600` (`#e86427`), `--c-orange-50` (`#fdefe9`).\n- **Grises Neutros**: `--c-gray-50` (`#fafafa` fondo general), `--c-gray-100` (`#dfe1e3` bordes), `--c-gray-800` (`#272a2f` texto principal).\n\n---\n\n## 3. Tipografía Oficial\n\nEl ecosistema digital Andreani utiliza dos tipografías maestras servidas vía Google Fonts:\n\n### Rubik (Títulos, Headlines y Badges)\nUtilizada en `h1` a `h6`, píldoras de marca y llamados a la acción destacados.\n- Variable: `--c-font-family-headline` / `--c-font-family-title`\n- Pesos: Medium (`500`), SemiBold (`600`), Bold (`700`), ExtraBold (`800`)\n\n### Roboto (Cuerpo, Tablas y Formularios)\nOptimizada para máxima legibilidad en diagramas técnicos, párrafos descriptivos y tablas operativas.\n- Variable: `--c-font-family-body` / `--c-font-family-label`\n- Pesos: Light (`300`), Regular (`400`), Medium (`500`), Bold (`700`)\n\n---\n\n## 4. Escala de Espaciados y Bordes\n\nPara mantener armonía espacial en paneles y vistas de observabilidad:\n\n### Espaciados\n- `--c-spacing-1`: `4px`\n- `--c-spacing-2`: `8px`\n- `--c-spacing-3`: `12px`\n- `--c-spacing-4`: `16px`\n- `--c-spacing-5`: `24px`\n- `--c-spacing-6`: `32px`\n- `--c-spacing-7`: `48px`\n\n### Radios de Borde\n- `--c-border-radius-xsmall`: `4px` (tags y etiquetas compactas)\n- `--c-border-radius-small`: `8px` (botones, inputs y tarjetas estándar)\n- `--c-border-radius-medium`: `16px` (modales y contenedores principales)\n- `--c-border-radius-large`: `24px` (tarjetas hero y banners)\n- `--c-border-radius-xlarge`: `99px` (píldoras y badges redondeados)\n\n---\n\n## 5. Implementación en Código CSS Nativo\n\nPara utilizar los estilos en cualquier componente o documento HTML:\n\n```html\n<!-- 1. Cargar fuentes oficiales -->\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Rubik:wght@500;600;700;800&display=swap\" rel=\"stylesheet\">\n\n<!-- 2. Vincular la hoja de estilos Cartesian -->\n<link rel=\"stylesheet\" href=\"cartesian.css\">\n```\n\n### Ejemplo de componente usando variables nativas:\n\n```css\n.tarjeta-sorter {\n  background-color: var(--c-color-surface);\n  border: var(--c-border-width-subtle) solid var(--c-color-border-neutral-soft);\n  border-radius: var(--c-border-radius-small);\n  padding: var(--c-spacing-5);\n  box-shadow: var(--card-shadow);\n}\n\n.tarjeta-sorter h3 {\n  font-family: var(--c-font-family-headline);\n  color: var(--c-color-text-content-title);\n  font-size: var(--c-font-size-headline5);\n  margin-bottom: var(--c-spacing-3);\n}\n\n.tarjeta-sorter p {\n  font-family: var(--c-font-family-body);\n  color: var(--c-color-text-content-base);\n  font-size: var(--c-font-size-bodymedium);\n  line-height: var(--c-font-lineheight-bodymedium);\n}\n\n.boton-accion {\n  background-color: var(--c-color-fill-primary);\n  color: var(--c-color-text-inverse);\n  border-radius: var(--c-border-radius-small);\n  padding: var(--c-spacing-2) var(--c-spacing-4);\n  font-family: var(--c-font-family-title);\n  border: none;\n  cursor: pointer;\n  transition: background-color 0.2s ease;\n}\n\n.boton-accion:hover {\n  background-color: var(--c-color-fill-primary-hover);\n}\n```\n\n---\n\n## 6. Soporte para Modo Oscuro\n\nEl sistema activa automáticamente los tokens de modo oscuro mediante el atributo `data-theme-mode=\"dark\"` o `data-theme=\"dark\"` en la etiqueta `<html>`:\n\n```html\n<html lang=\"es\" data-theme-mode=\"dark\">\n  <!-- Todos los tokens --c-color-* se transforman a su variante nocturna con alto contraste -->\n</html>\n```\n"}, "diag-catalog": {"category": "Documentación Técnica (docs)", "title": "🖼️ Catálogo de Diagramas", "content": "# 🎨 Catálogo de Diagramas de Arquitectura y Observabilidad\n\nEste directorio centraliza todos los **diagramas vectoriales (SVG), renders gráficos (PNG) y visores interactivos (HTML)** desarrollados para el ecosistema de Sorters de Andreani Logística.\n\nTodos los diagramas siguen estrictamente la paleta cromática corporativa **Cartesian** (Rojo Andreani `#d71920`, Azul Marino `#1f2856`, Neutros `#fafafa`/`#dfe1e3`) y la tipografía oficial **Rubik** y **Roboto**.\n\n---\n\n## 🧭 Índice de Diagramas\n\n| Diagrama | Formato | Documento que lo utiliza | Descripción |\n| :--- | :---: | :--- | :--- |\n| [**`arquitectura-resumida.svg`**](./arquitectura-resumida.svg) | SVG | [Home Page (`README.md`)](../../README.md) | Visión macro de integración: TMS (DMS/Integra) -> SPP -> Kafka -> Vertical Sorter -> AlwaysOn -> Dashboards. |\n| [**`tipologia-sorters.svg`**](./tipologia-sorters.svg) | SVG | [01. Arquitectura General](../01-arquitectura-general.md) | Cuadro comparativo de las 5 tecnologías de Sorters en la compañía (Vertical, TruxSorter, Wayzim, Giops, Regionales). |\n| [**`capas-tecnologicas.svg`**](./capas-tecnologicas.svg) | SVG | [01. Arquitectura General](../01-arquitectura-general.md) | Diagrama de las 5 capas de la solución: TMS/Canales, Middleware SPP, Mensajería/Bases, Clasificación Física y Monitoreo. |\n| [**`flujo-vertical.svg`**](./flujo-vertical.svg) | SVG | [02. Flujo E2E Vertical](../02-flujo-end-to-end-vertical.md) | Diagrama de secuencia detallado de las 6 fases del Vertical Sorter, incluyendo el loop de resiliencia de Rampa 6. |\n| [**`pilares-observabilidad.svg`**](./pilares-observabilidad.svg) | SVG | [04. Estrategia Observabilidad](../04-estrategia-observabilidad.md) | Los cuatro pilares de observabilidad para Sorters: Métricas SLI/SLO, Logs/APM, Health Checks Sintéticos y Matriz de Alarmas P1-P3. |\n| [**`diagrama-flujo-observabilidad.svg`**](./diagrama-flujo-observabilidad.svg) | SVG | [05. Flujo Observabilidad](../05-flujo-observabilidad.md) | Mapa de flujo end-to-end con la ubicación exacta de los 10 sensores de monitoreo recomendados (S1 a S10). |\n| [**`diagrama-flujo-observabilidad.png`**](./diagrama-flujo-observabilidad.png) | PNG | [05. Flujo Observabilidad](../05-flujo-observabilidad.md) | Render rasterizado de alta definición del mapa de observabilidad para visualización compatible sin soporte SVG. |\n| [**`diagrama-flujo-observabilidad.html`**](./diagrama-flujo-observabilidad.html) | HTML | [05. Flujo Observabilidad](../05-flujo-observabilidad.md) | Visor web interactivo independiente con zoom pan/pinch y visualización en tiempo real. |\n\n---\n\n## 🖼️ Vistas Previas\n\n### 1. Arquitectura Resumida\n![Arquitectura Resumida](docs/diagramas/arquitectura-resumida.svg)\n\n---\n\n### 2. Tipología de Sorters\n![Tipología de Sorters](docs/diagramas/tipologia-sorters.svg)\n\n---\n\n### 3. Capas Tecnológicas\n![Capas Tecnológicas](docs/diagramas/capas-tecnologicas.svg)\n\n---\n\n### 4. Flujo End-to-End Vertical Sorter y Rampa 6\n![Flujo Vertical](docs/diagramas/flujo-vertical.svg)\n\n---\n\n### 5. Cuatro Pilares de Observabilidad\n![Pilares de Observabilidad](docs/diagramas/pilares-observabilidad.svg)\n\n---\n\n### 6. Mapa Completo de Sensores de Observabilidad (S1 a S10)\n![Mapa de Sensores](docs/diagramas/diagrama-flujo-observabilidad.svg)\n"}, "rel-index": {"category": "Relevamiento de Campo", "title": "📁 Relevamiento: Índice General", "content": "# 📁 Material de Relevamiento - Ecosistema Sorters\n\nEsta carpeta centraliza todos los **documentos de trabajo, minutas, planillas, diagramas de diseño y grabaciones audiovisuales** recopilados durante las sesiones técnicas de relevamiento con los distintos equipos de Andreani (Arquitectura, Desarrollo SPP, Operaciones CIT, Infraestructura y Soporte).\n\nSirve como la **fuente de verdad histórica** y repositorio de evidencias a partir del cual se estructuró la documentación técnica oficial disponible en el portal [**`Sorters.html`**](../Sorters.html) y en la carpeta [**`docs/`**](../docs/).\n\n---\n\n## 🧭 Secciones de Relevamiento\n\nEl material se encuentra organizado por tipología de contenido:\n\n```text\nrelevamiento/\n├── reuniones/     # 🎙️ Minutas de reuniones y grabaciones de audio/video\n├── diagramas/     # 📐 Diagramas preliminares y fuentes de diagramación (Draw.io)\n└── planillas/     # 📊 Matrices maestras de toma de servicio e inventario (Excel)\n```\n\n---\n\n### 1. 🎙️ [Reuniones Técnicas y Minutas](./reuniones/README.md)\n\nDocumentación testimonial y minutas detalladas de los encuentros con referentes del negocio:\n- [**`reuniones/Observabilidad integral de los Sorters 01.docx`**](./reuniones/Observabilidad%20integral%20de%20los%20Sorters%2001.docx): Minuta técnica con la descripción funcional de SPP, Rampa 6, AlwaysOn y acuerdos de monitoreo.\n- **`reuniones/Observabilidad integral de los Sorters-20260810_140911-Grabación de la reunión.mp4`**: Grabación audiovisual completa de la sesión técnica de traspaso (10 de agosto de 2026).\n\nMás información en: [**Ver sección Reuniones**](./reuniones/README.md)\n\n---\n\n### 2. 📐 [Diagramas Preliminares y Fuentes](./diagramas/README.md)\n\nEsquemas de trabajo y archivos de diseño gráfico preliminares:\n- [**`diagramas/mapa de monitoreo sorter.drawio`**](./diagramas/mapa%20de%20monitoreo%20sorter.drawio): Archivo fuente editable en Draw.io con el modelado inicial de sensores y flujos.\n- [**`diagramas/Diagrama01.png`**](./diagramas/Diagrama01.png): Esquema preliminar analizado durante las sesiones de trabajo.\n\nMás información en: [**Ver sección Diagramas de Relevamiento**](./diagramas/README.md)\n\n---\n\n### 3. 📊 [Planillas y Tomas de Servicio](./planillas/README.md)\n\nMatrices de inventario y relevamiento exhaustivo de infraestructura:\n- [**`planillas/Toma_de_Servicio - Sorters.xlsx`**](./planillas/Toma_de_Servicio%20-%20Sorters.xlsx): Matriz consolidada de más de 50 microservicios, tópicos Kafka, bases SQL AlwaysOn, Redis e inventario de 20 PCs industriales de Sorters.\n\nMás información en: [**Ver sección Planillas**](./planillas/README.md)\n\n---\n\n## 🔗 Relación con la Documentación Oficial Consolidada\n\nTodo el material en bruto de esta carpeta ha sido normalizado y sintetizado en la documentación técnica del proyecto:\n\n| Sección de Relevamiento | Documento Oficial Consolidado en `docs/` |\n| :--- | :--- |\n| **Minuta de Reunión** (`reuniones/`) | [**`docs/01-arquitectura-general.md`**](../docs/01-arquitectura-general.md) y [**`docs/02-flujo-end-to-end-vertical.md`**](../docs/02-flujo-end-to-end-vertical.md) |\n| **Planilla Toma de Servicio** (`planillas/`) | [**`docs/03-inventario-componentes.md`**](../docs/03-inventario-componentes.md) |\n| **Estrategia y Acuerdos de Monitoreo** | [**`docs/04-estrategia-observabilidad.md`**](../docs/04-estrategia-observabilidad.md) |\n| **Diagrama Fuente Draw.io** (`diagramas/`) | [**`docs/05-flujo-observabilidad.md`**](../docs/05-flujo-observabilidad.md) y [**`docs/diagramas/`**](../docs/diagramas/) |\n| **Identidad Visual Corporativa** | [**`docs/06-guia-estilos-cartesian.md`**](../docs/06-guia-estilos-cartesian.md) |\n| **Portal Unificado Interactivo** | [**`Sorters.html`**](../Sorters.html) |\n"}, "rel-reuniones": {"category": "Relevamiento de Campo", "title": "🎙️ Relevamiento: Reuniones y Minutas", "content": "# 🎙️ Relevamiento: Reuniones Técnicas y Minutas\n\nEsta sección resguarda el registro documental y audiovisual de las sesiones de relevamiento realizadas con los referentes de arquitectura, desarrollo y operaciones de Andreani.\n\n---\n\n## 📅 Sesión Principal: Traspaso de Arquitectura y Observabilidad Sorters\n\n- **Fecha:** 10 de Agosto de 2026 (14:09 hs)\n- **Objetivo:** Traspaso integral de la arquitectura del ecosistema de Sorters, identificación de dependencias de SPP, diseño del circuito de resiliencia de Rampa 6, esquemas de replicación AlwaysOn y acuerdos de instrumentación de observabilidad.\n- **Participantes Relevados:** Referentes de Arquitectura, Líder Técnico de SPP/Sorters, Operaciones CIT y Equipo de Observabilidad.\n\n---\n\n## 📂 Archivos en esta Sección\n\n| Archivo | Tipo | Tamaño | Descripción |\n| :--- | :---: | :---: | :--- |\n| [**`Observabilidad integral de los Sorters 01.docx`**](./Observabilidad%20integral%20de%20los%20Sorters%2001.docx) | Word (DOCX) | ~3.7 MB | **Minuta técnica detallada.** Contiene transcripción de definiciones operativas, rol del middleware SPP, detalle de latencias en enriquecimiento (NDD/Geo), funcionamiento de Rampa 6, criticidad de la réplica de lectura de `DBSORTER` y matriz de criticidad. |\n| **`Observabilidad integral de los Sorters-20260810_140911-Grabación de la reunión.mp4`** | Video (MP4) | ~279 MB | **Grabación audiovisual completa de la sesión.** Permite auditar en detalle explicaciones sobre el terreno, consultas sobre la caja negra de proveedores (Optisoft) y demostraciones en vivo. *(Nota: Excluido de Git por peso).* |\n\n---\n\n## 📌 Principales Conclusiones de la Sesión\n\n1. **Prioridad Vertical Sorter:** Se definió que el clasificador del 1° Piso de CIT es el caso testigo y prioritario por combinar microservicios en Kubernetes, eventos Kafka, bases AlwaysOn, Redis y software de terceros.\n2. **Riesgo \"Tablero en Cero\":** Si el componente `verticaltoSpp-publisher` falla, la máquina sigue clasificando pero los tableros quedan en 0 bultos/hora. Debe catalogarse como alerta **P1 Crítica**.\n3. **Mecanismo de Resiliencia Rampa 6:** Los bultos sin datos en la base local son derivados a Rampa 6; el job `job-spptovertical` los reinyecta desde `DBSORTER` para permitir su reclasificación exitosa en la segunda inducción.\n4. **Réplica de Lectura AlwaysOn:** El frontend `spp-dashboard-ui` y las APIs de consulta dependen exclusivamente de la réplica de lectura de `DBSORTER`. Una desincronización deja ciega a la planta.\n"}, "rel-diagramas": {"category": "Relevamiento de Campo", "title": "📐 Relevamiento: Diagramas Preliminares", "content": "# 📐 Relevamiento: Diagramas Preliminares y Fuentes\n\nEsta sección resguarda los esquemas, bosquejos gráficos y archivos de diseño elaborados durante las sesiones de entrevistas técnicas previas a la consolidación de la documentación formal.\n\n---\n\n## 📂 Archivos en esta Sección\n\n| Archivo | Tipo | Tamaño | Descripción |\n| :--- | :---: | :---: | :--- |\n| [**`mapa de monitoreo sorter.drawio`**](./mapa%20de%20monitoreo%20sorter.drawio) | Draw.io XML | ~22 KB | **Archivo fuente editable de diagramación.** Modelo de trabajo que detalla los sensores de observabilidad propuestos (S1 a S10), flujos entre microservicios de SPP, conexiones AlwaysOn y puntos de interacción con el hardware. Puede abrirse y editarse directamente en diagrams.net / draw.io. |\n| [**`Diagrama01.png`**](./Diagrama01.png) | Imagen PNG | ~69 KB | **Captura gráfica preliminar.** Diagrama de arquitectura inicial trazado durante la primera sesión de análisis con el equipo técnico para mapear las interacciones entre TMS, SPP y el clasificador. |\n\n---\n\n## 🔄 Evolución hacia la Documentación Oficial\n\nA partir de estos esquemas preliminares de trabajo se generaron los diagramas vectoriales interactivos y definitivos del proyecto, alojados en:\n- [**`docs/diagramas/`**](../../docs/diagramas/): Repositorio centralizado de diagramas SVG, PNG y visor HTML interactivo.\n- [**`docs/05-flujo-observabilidad.md`**](../../docs/05-flujo-observabilidad.md): Especificación técnica de los puntos de control S1 a S10.\n"}, "rel-planillas": {"category": "Relevamiento de Campo", "title": "📊 Relevamiento: Planillas y Tomas", "content": "# 📊 Relevamiento: Planillas y Tomas de Servicio\n\nEsta sección resguarda las planillas de cálculo, matrices técnicas y relevamientos de inventario provistos por los equipos de desarrollo e infraestructura para el ecosistema de Sorters.\n\n---\n\n## 📂 Archivos en esta Sección\n\n| Archivo | Tipo | Tamaño | Descripción |\n| :--- | :---: | :---: | :--- |\n| [**`Toma_de_Servicio - Sorters.xlsx`**](./Toma_de_Servicio%20-%20Sorters.xlsx) | Excel (XLSX) | ~32 KB | **Matriz integral de toma de servicio.** Planilla técnica oficial con el relevamiento pormenorizado de componentes, clusters, namespaces, repositorios Git, dependencias de red e inventario de PCs industriales de clasificación. |\n\n---\n\n## 📑 Estructura y Contenido de la Planilla\n\nLa matriz maestra `Toma_de_Servicio - Sorters.xlsx` se organiza en las siguientes dimensiones técnicas:\n\n1. **Microservicios y Workers:**\n   - Detalle de más de 50 servicios en Kubernetes (clústeres CCE, AKS-BR, K3H y K3S).\n   - Namespaces operados: `TYD-SPP` (lógica de negocio y procesamiento) y `TYD-SORTERS` (clasificadores de paquetería).\n   - Enlaces directos a los repositorios de Azure DevOps y pipelines de CI/CD.\n2. **Mensajería Apache Kafka:**\n   - Tópicos de ingesta de envíos (`orden-envio-solicitada`, `orden-envio-creada`).\n   - Tópicos de SPP (`spp.alta-envio`, `spp.asignacion-custodia`, `spp.cambio-destino`).\n   - Tópicos de balanza y consolidación (`bulto-informado`, `bulto-pesado-y-medido`, `apto-para-consolidar`).\n3. **Bases de Datos y Caching:**\n   - Instancias Microsoft SQL Server AlwaysOn (`DBSORTER` e `Integración Vertical`).\n   - Instancia Redis (`DBSORTERPROD`) para offset y cursores de lectura.\n4. **Hardware Industrial y PCs en Planta:**\n   - Relevamiento de 20 puestos de Sorters a lo largo del país (CIT, Córdoba, Bariloche, Tucumán, CTC, Pacheco, Avellaneda, Mendoza, Salta, etc.).\n   - Direcciones IP estáticas y asignación en dominio corporativo.\n\n---\n\n## 🔗 Consolidación en la Documentación Oficial\n\nEl contenido de esta planilla se encuentra normalizado y documentado en:\n- [**`docs/03-inventario-componentes.md`**](../../docs/03-inventario-componentes.md): Catálogo completo estructurado en tablas Markdown.\n"}};
    const fileToKey = {"README.md": "readme", "docs/01-arquitectura-general.md": "01-arch", "docs/02-flujo-end-to-end-vertical.md": "02-flow", "docs/03-inventario-componentes.md": "03-inv", "docs/04-estrategia-observabilidad.md": "04-obs", "docs/05-flujo-observabilidad.md": "05-flujo", "docs/06-guia-estilos-cartesian.md": "06-cartesian", "docs/diagramas/README.md": "diag-catalog", "relevamiento/README.md": "rel-index", "relevamiento/reuniones/README.md": "rel-reuniones", "relevamiento/diagramas/README.md": "rel-diagramas", "relevamiento/planillas/README.md": "rel-planillas"};

    // Theme Switcher
    let currentTheme = localStorage.getItem('theme') || 'light';
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.setAttribute('data-theme-mode', theme);
      localStorage.setItem('theme', theme);
      const lbl = document.getElementById('lbl-theme');
      if (lbl) lbl.textContent = theme === 'dark' ? 'Tema Claro' : 'Tema Oscuro';
    }
    function toggleTheme() {
      currentTheme = currentTheme === 'light' ? 'dark' : 'light';
      applyTheme(currentTheme);
    }
    applyTheme(currentTheme);

    // Wide Mode Switcher
    let isWideMode = localStorage.getItem('wide-mode') === 'true';
    function applyWideMode(wide) {
      isWideMode = wide;
      localStorage.setItem('wide-mode', wide);
      const wrapper = document.getElementById('content-wrapper');
      const btn = document.getElementById('btn-wide');
      const lbl = document.getElementById('lbl-wide');
      if (wrapper) wrapper.classList.toggle('wide-mode', wide);
      if (btn) btn.classList.toggle('active', wide);
      if (lbl) lbl.textContent = wide ? 'Ancho Estándar' : 'Vista Ancha';
    }
    function toggleWideMode() {
      applyWideMode(!isWideMode);
    }
    applyWideMode(isWideMode);

    // Load Document
    function loadDoc(key) {
      const doc = docs[key];
      if (!doc) return;

      // Update Nav
      document.querySelectorAll('.nav-link').forEach(link => {
        link.classList.toggle('active', link.dataset.key === key);
      });

      // Update Breadcrumb
      document.getElementById('breadcrumb-title').textContent = doc.title.replace(/^[^\w\s]+/, '').trim();

      // Parse markdown
      const html = marked.parse(doc.content);
      const contentEl = document.getElementById('content');
      contentEl.innerHTML = html;

      // Scroll to top
      document.getElementById('main').scrollTop = 0;

      // Enhance all images with Zoom Containers
      enhanceImagesAndDiagrams(contentEl);

      // Enhance links to switch docs in-app
      enhanceInternalLinks(contentEl);

      // Render Mermaid diagrams if present
      setTimeout(() => {
        if (window.mermaid) {
          mermaid.run({
            nodes: contentEl.querySelectorAll('.mermaid')
          }).catch(err => console.error("Mermaid render error:", err));
        }
      }, 50);
    }

    // Intercept internal doc links to load without full page reload
    function enhanceInternalLinks(container) {
      const links = container.querySelectorAll('a');
      links.forEach(a => {
        const href = a.getAttribute('href');
        if (!href) return;
        // Clean relative path ./ or ../
        let clean = href.replace(/^(\.\.\/)+/, '').replace(/^\.\//, '');
        if (clean.endsWith('.html') && clean.includes('Sorters')) {
          a.addEventListener('click', (e) => {
            e.preventDefault();
            loadDoc('readme');
          });
          return;
        }
        for (const [filePath, docKey] of Object.entries(fileToKey)) {
          if (clean === filePath || href === filePath || href.endsWith(filePath)) {
            a.addEventListener('click', (e) => {
              e.preventDefault();
              loadDoc(docKey);
            });
            break;
          }
        }
      });
    }

    // Wrap images with diagram container & zoom trigger
    function enhanceImagesAndDiagrams(container) {
      const images = container.querySelectorAll('img');
      images.forEach(img => {
        if (img.closest('.diagram-container')) return;

        const altText = img.getAttribute('alt') || 'Diagrama';
        const src = img.getAttribute('src');

        const wrapper = document.createElement('div');
        wrapper.className = 'diagram-container';

        const headerBar = document.createElement('div');
        headerBar.className = 'diagram-header-bar';
        headerBar.innerHTML = `
          <span class="badge-diag">📊 ${altText}</span>
          <button class="btn-zoom-trigger" type="button" title="Ver en pantalla completa con zoom">
            🔍 Abrir con Zoom / Pantalla Completa
          </button>
        `;

        img.parentNode.insertBefore(wrapper, img);
        wrapper.appendChild(headerBar);
        wrapper.appendChild(img);

        // Click handler for zoom
        const openHandler = (e) => {
          e.preventDefault();
          e.stopPropagation();
          openLightbox(src, altText);
        };

        img.addEventListener('click', openHandler);
        headerBar.querySelector('.btn-zoom-trigger').addEventListener('click', openHandler);
      });
    }

    // Build sidebar with category headers
    const navList = document.getElementById('nav-list');
    let firstKey = null;
    let currentCat = '';
    for (const [key, item] of Object.entries(docs)) {
      if (!firstKey) firstKey = key;
      if (item.category && item.category !== currentCat) {
        currentCat = item.category;
        const catLi = document.createElement('li');
        catLi.className = 'nav-category-header';
        catLi.textContent = currentCat;
        navList.appendChild(catLi);
      }
      const li = document.createElement('li');
      li.className = 'nav-item';
      li.innerHTML = `<a class="nav-link" data-key="${key}" onclick="loadDoc('${key}')">${item.title}</a>`;
      navList.appendChild(li);
    }

    // Filter docs
    function filterDocs(query) {
      const q = query.toLowerCase().trim();
      document.querySelectorAll('#nav-list .nav-item').forEach(li => {
        const text = li.textContent.toLowerCase();
        li.style.display = text.includes(q) ? '' : 'none';
      });
      // Hide headers if no items visible in category
      document.querySelectorAll('#nav-list .nav-category-header').forEach(header => {
        let next = header.nextElementSibling;
        let hasVisible = false;
        while (next && !next.classList.contains('nav-category-header')) {
          if (next.style.display !== 'none') hasVisible = true;
          next = next.nextElementSibling;
        }
        header.style.display = hasVisible ? '' : 'none';
      });
    }

    // ==========================================
    // Interactive Lightbox Zoom & Pan Engine
    // ==========================================
    let currentScale = 1;
    let translateX = 0;
    let translateY = 0;
    let isDragging = false;
    let startX = 0;
    let startY = 0;
    let currentImgSrc = '';

    const modal = document.getElementById('lightbox-modal');
    const lbImg = document.getElementById('lightbox-img');
    const lbCanvas = document.getElementById('lightbox-canvas');
    const lbBody = document.getElementById('lightbox-body');
    const lbTitle = document.getElementById('lightbox-title');
    const zoomInd = document.getElementById('zoom-indicator');

    function openLightbox(src, title) {
      currentImgSrc = src;
      lbTitle.textContent = title || 'Visualizador de Diagrama';

      lbImg.src = src;
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';

      translateX = 0;
      translateY = 0;

      const triggerFit = () => {
        fitToScreen();
      };

      lbImg.onload = triggerFit;
      if (lbImg.complete) {
        triggerFit();
      }
      setTimeout(triggerFit, 30);
      setTimeout(triggerFit, 150);
    }

    function closeLightbox() {
      modal.classList.remove('active');
      document.body.style.overflow = '';
    }

    function updateTransform() {
      lbCanvas.style.transform = `translate(${translateX}px, ${translateY}px) scale(${currentScale})`;
      zoomInd.textContent = Math.round(currentScale * 100) + '%';
    }

    function zoomIn() {
      currentScale = Math.min(currentScale * 1.25, 8.0);
      updateTransform();
    }

    function zoomOut() {
      currentScale = Math.max(currentScale / 1.25, 0.05);
      updateTransform();
    }

    function resetZoom() {
      currentScale = 1;
      translateX = 0;
      translateY = 0;
      updateTransform();
    }

    function fitToScreen() {
      const bRect = lbBody.getBoundingClientRect();
      let imgW = lbImg.naturalWidth || lbImg.offsetWidth;
      let imgH = lbImg.naturalHeight || lbImg.offsetHeight;

      if (!imgW || imgW <= 0) imgW = 1400;
      if (!imgH || imgH <= 0) imgH = 800;

      lbImg.style.width = imgW + 'px';
      lbImg.style.height = 'auto';

      const availW = bRect.width * 0.92;
      const availH = bRect.height * 0.88;

      const scaleW = availW / imgW;
      const scaleH = availH / imgH;
      currentScale = Math.min(scaleW, scaleH);

      if (currentScale > 1.2) currentScale = 1.0;
      if (currentScale < 0.05) currentScale = 0.1;

      translateX = 0;
      translateY = 0;
      updateTransform();
    }

    function openOriginal() {
      if (currentImgSrc) {
        window.open(currentImgSrc, '_blank');
      }
    }

    // Mouse Dragging
    lbBody.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      isDragging = true;
      startX = e.clientX - translateX;
      startY = e.clientY - translateY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      translateX = e.clientX - startX;
      translateY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
    });

    // Wheel Zoom
    lbBody.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.15 : 0.87;
      currentScale = Math.min(Math.max(currentScale * zoomFactor, 0.05), 10.0);
      updateTransform();
    }, { passive: false });

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (!modal.classList.contains('active')) return;
      if (e.key === 'Escape') {
        closeLightbox();
      } else if (e.key === '+' || e.key === '=') {
        zoomIn();
      } else if (e.key === '-' || e.key === '_') {
        zoomOut();
      } else if (e.key === '0') {
        resetZoom();
      }
    });

    // Initial Load
    if (firstKey) {
      loadDoc(firstKey);
    }
  </script>
</body>

</html>
